pre-commit:
  jobs:
    # The stack-register gate: no dependency lands without a docs/stack.md
    # entry backed by an approved decision record. Cheap, unconditional.
    - name: stack-register
      run: node scripts/check-stack.mjs
    - name: biome
      glob: "*.{ts,js,tsx,jsx,json,jsonc,svelte}"
      run: pnpm run check:biome {staged_files} && git add {staged_files}
    - name: lint
      glob: "*.{ts,js}"
      run: biome lint {staged_files}
    - name: typecheck
      glob: "*.{ts,js}"
      run: pnpm run typecheck
    # Every commit must leave the server suite green — no file filter, so
    # this runs unconditionally (the authoring-session tests silently rotted
    # on environment debris exactly because tests were not a commit gate).
    - name: server-tests
      run: pnpm --filter server test
