<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hive</title>
    <meta
      name="theme-color"
      content="#16130a"
      media="(prefers-color-scheme: dark)"
    >
    <meta
      name="theme-color"
      content="#f4efdf"
      media="(prefers-color-scheme: light)"
    >
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3Cpath id='h' d='M3 0L1.5 2.6L-1.5 2.6L-3 0L-1.5-2.6L1.5-2.6Z'/%3E%3C/defs%3E%3Cuse href='%23h' transform='translate(8 5.8)' fill='none' stroke='%23f5b342' stroke-width='1.2'/%3E%3Cuse href='%23h' transform='translate(4.7 11.4)' fill='none' stroke='%23f5b342' stroke-width='1.2'/%3E%3Cuse href='%23h' transform='translate(11.3 11.4)' fill='none' stroke='%23f5b342' stroke-width='1.2'/%3E%3C/svg%3E"
    >
    <link rel="stylesheet" href="./app.css">
    <script>
    (() => {
      var t = localStorage.getItem("theme");
      if (!t)
        t = matchMedia("(prefers-color-scheme:light)").matches
          ? "light"
          : "dark";
      if (t === "light") {
        document.documentElement.classList.add("light");
      }
    })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
